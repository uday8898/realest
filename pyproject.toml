[project]
name = "realest"
version = "0.1.0"
description = "The Zero Lag: AI property assistant for real estate brokers (FastAPI backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "openai>=1.50",
    "python-multipart",
    "python-dotenv",
    "pypdf",
    "httpx",
]

[tool.fastapi]
entrypoint = "app.main:app"

# Run as an application (install dependencies only). Without this the builder tries to package the repo
# and fails on the app/, static/ and samples/ folders ("Multiple top-level packages discovered").
[tool.uv]
package = false

# Explicit package discovery: the repo is an application, not a library. Without this the builder's setuptools
# step fails ("Multiple top-level packages discovered: app, static, samples"). An empty list installs the
# dependencies only; the app itself runs from the source folder via [tool.fastapi] above.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
