<script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }</script>
<style>
  /* Flat monochrome. No gradients, no emoji, no external requests (system fonts, one 7 KB logo). */
  :root {

  :root[data-theme="light"] {
    --bg: #f4f4f5; --surface: #ffffff; --surface2: #f0f0f2; --line: #dcdce1; --line2: #c4c4cc;

    --grid: rgba(10,10,11,.06); --grid2: rgba(10,10,11,.12);
    --me-bg: #0a0a0b; --me-ink: #f4f4f5;
    --ok: #0f8a4a; --warn: #a76a00; --bad: #c4352e;

  /* technical grid: minor lines every 32px, major every 160px; fixed layer so it never repaints */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image: linear-gradient(var(--grid2) 1px, transparent 1px), linear-gradient(90deg, var(--grid2) 1px, transparent 1px),

  /* ---------- header ---------- */

  details.menu .pop { position: absolute; right: 0; top: 44px; z-index: 20; width: 290px; padding: 14px; background: var(--surface); border: 1px solid var(--line2); box-shadow: var(--shadow); display: grid; gap: 10px; }

  /* ---------- layout ---------- */

  }

  /* ---------- briefing ---------- */

  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  /* ---------- composer ---------- */

  .ic.rec { background: var(--bad); color: #fff; animation: blink 1s infinite; }

  /* ---------- side panel ---------- */
  .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; padding: 0 12px; background: var(--surface); } .tabs::-webkit-scrollbar { display: none; }

  .sec { font: 600 13px var(--mono); margin: 12px 0 0; color: var(--muted); }

  .frm { display: grid; gap: 8px; }
  .frm input, .frm textarea, .frm select, .sheet input, .sheet textarea { border: 1px solid var(--line2); padding: 9px 11px; background: var(--surface2); width: 100%; outline: none; border-radius: 0; }

  .frm select option { color: #111; }

  .empty { color: var(--muted); text-align: center; padding: 40px 10px; font: 500 13px var(--mono); }
  .row { display: flex; gap: 12px; color: var(--muted); font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--line); } .row b { color: var(--ink); font: 600 13px var(--mono); min-width: 130px; }
  .okmsg { color: var(--ok); } .errmsg { color: var(--bad); }

  /* ---------- data views ---------- */

  .tool .top { display: flex; gap: 8px; }

  .tool input { flex: 1; } .tool input:focus, .tool select:focus { border-color: var(--ink); } .tool select option { color: #111; }

  .pills button i { font-style: normal; opacity: .6; margin-left: 5px; }

  #lock[hidden] { display: none; }

  /* ---------- friendly overrides: rounded, soft, plain ---------- */

  :root[data-theme="light"] { --ok-bg: rgba(15,138,74,.10); --warn-bg: rgba(167,106,0,.12); --bad-bg: rgba(196,53,46,.10); --line: #e4e4e8; --line2: #d6d6dc; }
  .word { font-weight: 600; font-size: 17px; line-height: 1.15; }

  .seg { padding: 3px; } .seg button { border-radius: 9px; font-size: 14px; font-weight: 500; padding: 6px 18px; }

  .tabs button.on { font-weight: 600; } .cnt { font-size: 12px; font-weight: 500; }

  .tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .tpl { border: 0; background: var(--warn-bg); border-radius: 99px; padding: 3px 10px; font-size: 12.5px; }
  .pills { border: 1px solid var(--line2); border-radius: var(--r); overflow: hidden; }
  .pills button { border: 0; border-right: 1px solid var(--line2); margin: 0; padding: 7px 13px; font-size: 13.5px; font-weight: 500; }
  .pills button:last-child { border-right: 0; } .pills button.on { font-weight: 600; }

  .sum, .bs { font-size: 13.5px; font-weight: 400; color: var(--muted); }

<script>
const $ = s => document.querySelector(s);
// Backend address (empty = same host). On Vercel it is written into /config.js at build time from API_BASE.
const API = (window.API_BASE || '').replace(/\/$/, '');
const getKey = () => { try { return localStorage.getItem('accessKey') || ''; } catch (e) { return ''; } };
const asset = u => (u && u.startsWith('/uploads/')) ? API + u : u;
let lockShown = false;
function showLock() { if (lockShown) return; lockShown = true; $('#lock').hidden = false; setTimeout(() => $('#lockkey').focus(), 50); }
const _fetch = window.fetch.bind(window);
window.fetch = (url, opts = {}) => {
  if (typeof url === 'string' && url.startsWith('/api/')) {
    opts = {...opts, headers: {...(opts.headers || {}), 'x-access-key': getKey()}};
    return _fetch(API + url, opts).then(r => { if (r.status === 401) showLock(); return r; });
  }
  return _fetch(url, opts);
};
async function download(url, name) {
  const r = await fetch(url); if (!r.ok) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
let lastId = 0, broker = localStorage.getItem('broker') || 'yuvraj', tab = 'listings', state = null, files = [], rec = null, chunks = [], samples = [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*(.+?)\*/g, '<b>$1</b>');
const money = (r, rent) => r == null ? '?' : rent ? '₹' + Math.round(r).toLocaleString('en-IN') + '/mo' : r >= 1e7 ? +(r/1e7).toFixed(2) + ' cr' : r >= 1e5 ? +(r/1e5).toFixed(2) + ' lakh' : '₹' + Math.round(r);

const secs = ms => ms < 1000 ? '0.' + String(Math.max(Math.round(ms / 10), 1)).padStart(2, '0') + 's' : (ms / 1000).toFixed(1) + 's';
const STATUS = {available: 'Available', stale: 'Check needed', under_negotiation: 'In talks', on_hold: 'On hold', sold: 'Sold', rented: 'Rented', open: 'Open', closed: 'Closed'};
const FLEX = {firm: 'Firm price', some: 'Some room', high: 'Very flexible'};
const ICON_SHARE = '<svg class="i s" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg>';

function bubble(role, text, media = [], ms = null, fast = false) {
  const d = document.createElement('div'); d.className = 'b ' + role;
  let h = media.some(m => m.kind === 'template') ? '<div class="tpl">Sent as template, outside 24h window</div>' : '';
  h += text ? fmt(text) : '';
  for (const m of media) {
    if (m.kind === 'image') h += `<img src="${asset(m.url)}" alt="">`;
    if (m.kind === 'audio') h += `<div class="att">Voice note</div><div class="tr">“${esc(m.transcript || '')}”</div>`;
    if (m.kind === 'pdf') h += `<div class="att">PDF · ${esc(m.name || 'document.pdf')}</div>`;
  }
  d.innerHTML = h || '…';
  if (role === 'bot' && text) {
    d.dataset.text = text;
    d.insertAdjacentHTML('beforeend', `<div class="meta"><a onclick="shareReply(this.closest('.b').dataset.text)">${ICON_SHARE} WhatsApp</a>${ms != null ? `<span>${fast ? 'Instant' : 'Replied in ' + secs(ms)}</span>` : ''}</div>`);
  }
  $('#msgs').appendChild(d); $('#msgs').scrollTop = 1e9; return d;
}

function setLat(ms, fast) { const el = $('#lat'); el.textContent = secs(ms).toUpperCase(); el.className = 'lat ' + (fast || ms < 600 ? 'fast' : ms > 4000 ? 'slow' : ''); }

async function loadAll() {
  const [st, br] = await Promise.all([fetch('/api/state?broker_id=' + broker).then(r => r.json()), fetch('/api/briefing?broker_id=' + broker).then(r => r.json())]);

}
async function load() {
  builtTab = null; $('#pane').innerHTML = skel(6);
  const br = await loadAll(); $('#msgs').innerHTML = ''; $('#msgs').style.scrollBehavior = 'auto';
  state.messages.forEach(m => bubble(m.role === 'broker' ? 'me' : 'bot', m.text, m.media));
  $('#msgs').style.scrollBehavior = '';
  lastId = state.messages.reduce((a, m) => Math.max(a, m.id), 0);
  renderBrief(br); renderSide(); defaultChips();
}
async function refresh() { const br = await loadAll(); renderBrief(br); renderSide(); }

function renderBrief(b) {
  const items = b.items.map(i => `<button class="chip" data-send="${esc(i.send)}">${esc(i.text)}</button>`).join('');
  $('#brief').innerHTML = `<div class="bcard"><div class="bh"><span class="hi">${esc(b.greeting)}</span><span class="bs">${b.stats.live} properties · ${b.stats.open_requirements} client needs</span></div>` +
    (items ? `<div class="calm" style="margin-top:10px">Here is what needs you today:</div><div class="bi">${items}</div>` : '<div class="calm">You are all caught up. Nothing needs your attention right now.</div>') + '</div>';
  document.querySelectorAll('#brief [data-send]').forEach(c => c.onclick = () => sendText(c.dataset.send));
}

function chips(list) {
  const box = $('#sugg'); box.innerHTML = '';
  list.forEach(s => {
    const b = document.createElement('button'); b.className = 'chip' + (s.share ? ' hot' : ''); b.textContent = s.label;
    b.onclick = () => s.share ? shareMany(s.share) : s.fill != null ? (($('#txt').value = s.fill), autosize(), $('#txt').focus()) : sendText(s.send);

}
function defaultChips() {
  chips([{label: 'Find a 3 BHK floor under 8 crore', send: 'find me a 3 BHK floor in Sushant Lok under 8 cr, park facing'},
         {label: 'Which properties need a check?', send: 'which listings need confirming?'},
         {label: 'My follow-ups', send: 'my follow-ups'}, {label: 'Today’s summary', send: 'today’s summary'}]);
}

// ---------- structured side panel ----------
const ui = {q: '', type: 'all', view: 'all', sort: 'new', open: new Set(), reqOpen: new Set()};
let builtTab = null;
const TYPE_NAMES = {plot: 'Plots', builder_floor: 'Builder floors', apartment: 'Apartments'};
const needsAttention = l => l.status === 'stale' || (l.low_confidence || []).length > 0;
const statusCls = st => st === 'available' ? 'ok' : st === 'stale' ? 'warn' : st === 'sold' || st === 'rented' ? 'bad' : '';
const dayKey = iso => new Date(iso).toLocaleDateString('en-CA');
const dayLabel = iso => { const k = dayKey(iso), t = dayKey(new Date()), y = dayKey(new Date(Date.now() - 864e5)); return k === t ? 'Today' : k === y ? 'Yesterday' : new Date(iso).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'}); };
const timeLabel = iso => new Date(iso).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
const CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg>';
const skel = n => Array.from({length: n}, () => '<div class="skel"></div>').join('');
function setHTML(el, html, key) { const k = JSON.stringify(key); if (el.dataset.k === k) return; el.dataset.k = k; el.innerHTML = html; }   // skip identical renders: no flicker, scroll and focus survive
function groupBy(arr, keyFn) { const m = new Map(); arr.forEach(x => { const k = keyFn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; }

function renderSide() {
  $('#adminTab').hidden = state.me.role !== 'owner'; if (tab === 'admin' && state.me.role !== 'owner') tab = 'listings';
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  const cnt = {listings: state.listings.length, reqs: state.requirements.filter(r => r.status === 'open').length, notes: state.notes.length, groups: state.groups.length, history: ''};
  document.querySelectorAll('.tabs button').forEach(x => { const c = x.querySelector('.cnt'); if (c) c.textContent = cnt[x.dataset.tab] || ''; });
  const c = state.settings;
  $('#cfg').textContent = c.enabled ? `Reminders every ${c.interval_hours}h, ${c.business_start}–${c.business_end}; day summary at ${c.eod_time}${c.snooze_until && c.snooze_until > new Date().toISOString() ? ' · snoozed' : ''}` : 'Reminders are off';
  if (builtTab !== tab) { buildPane(); builtTab = tab; }
  ({listings: renderList, reqs: renderReqs, notes: renderNotes, history: renderHistory, groups: renderGroups, admin: () => {}})[tab]();
}

function buildPane() {
  const p = $('#pane'); p.classList.remove('fade'); void p.offsetWidth; p.classList.add('fade');
  if (tab === 'listings') {
    p.innerHTML = `<div class="tool"><div class="top"><input id="q" type="search" placeholder="Search properties" value="${esc(ui.q)}" autocomplete="off"><select id="sort" aria-label="Sort"><option value="new">Newest</option><option value="attention">Needs a check first</option><option value="high">Price: high to low</option><option value="low">Price: low to high</option><option value="old">Not checked for longest</option></select></div>
      <div class="pillrow"><div class="pills" data-k="type"><button data-v="all">All<i></i></button><button data-v="plot">Plots<i></i></button><button data-v="builder_floor">Floors<i></i></button><button data-v="apartment">Apartments<i></i></button></div>
      <div class="pills" data-k="view"><button data-v="all">All</button><button data-v="attention">Needs a check<i></i></button><button data-v="sale">For sale</button><button data-v="rent">For rent</button></div></div>

    p.innerHTML = `<div class="m" style="color:var(--muted)">Messages from your WhatsApp groups can be passed to the assistant. It alerts you only about real property listings and client needs. Everything else is skipped and <b>never saved</b>.</div>

// ----- inventory -----
function filteredListings(src) {
  const q = ui.q.trim().toLowerCase();
  const by = {new: (a, b) => b.id - a.id, high: (a, b) => (b.price_total || 0) - (a.price_total || 0), low: (a, b) => (a.price_total || 9e15) - (b.price_total || 9e15),
              old: (a, b) => (b.age_days || 0) - (a.age_days || 0), attention: (a, b) => (needsAttention(b) - needsAttention(a)) || (b.age_days || 0) - (a.age_days || 0)};
  return src.filter(l => (ui.type === 'all' || l.type === ui.type)
      && (ui.view === 'all' || (ui.view === 'attention' ? needsAttention(l) : l.purpose === ui.view))
      && (!q || [l.title, l.market, l.society, l.owner_name, l.notes, l.facts.join(' '), '#' + l.id].join(' ').toLowerCase().includes(q))).sort(by[ui.sort]);
}
function listRow(l, readonly) {
  const rent = l.purpose === 'rent', open = ui.open.has(l.id);

      <span class="lmain"><span class="lt">${esc(l.title)}${rent ? ' · rent' : ''}</span><span class="ls">${esc(l.market)}${l.facts.length ? ' · ' + esc(l.facts.slice(0, 3).join(' · ')) : ''}</span></span>
      <span class="lright"><span class="price">${money(l.price_total, rent)}</span><span class="tag ${statusCls(l.status)}">${STATUS[l.status] || l.status}</span>${(l.low_confidence || []).length && l.status !== 'stale' ? '<span class="tag warn">Please confirm</span>' : ''}</span>${CHEV}</button>
    <div class="ldet"><div class="ldin" ${open ? 'data-ready="1"' : ''}>${open ? detail(l, readonly) : ''}</div></div></div>`;
}
function detail(l, readonly) {
  const rent = l.purpose === 'rent';
  const kv = [['Market', l.market], ['Purpose', rent ? 'Rent' : 'Sale'], ['Facing', l.facing], ['Road', l.road_width_ft && l.road_width_ft + ' ft'], ['Plot size', l.size_gaj && l.size_gaj + ' gaj'],
    ['Super area', l.super_sqft && l.super_sqft + ' sq ft'], ['Floor', l.floor_number != null && (l.floor_number === 0 ? 'Ground' : l.floor_number)], ['Parking', l.parking_type],
    ['Rate', l.type === 'plot' && l.price_per_gaj ? money(l.price_per_gaj) + ' per gaj' : null], ['Furnishing', l.furnishing], ['Owner', l.owner_name], ['Contact', l.owner_contact],
    ['Price', l.price_flexibility && FLEX[l.price_flexibility]], ['Source', l.source || (l.shared_by && 'Shared by ' + l.shared_by)], ['Last checked', l.age_days === 0 ? 'Today' : l.age_days + ' days ago']]
    .filter(([, v]) => v !== null && v !== undefined && v !== false && v !== '');
  const flags = (l.low_confidence || []).length ? `<div class="note" style="border-color:var(--warn)">Please check: ${esc(l.low_confidence.join(', ').replace(/_/g, ' '))}. Reply “ok” in chat if it is correct.</div>` : '';
  return `<div class="dbody"><div class="kv">${kv.map(([k, v]) => `<div><small>${k}</small><span>${esc(v)}</span></div>`).join('')}</div>${flags}
    ${l.notes ? `<div class="note">${esc(l.notes)}</div>` : ''}${l.photos && l.photos.length ? `<div class="m" style="color:var(--muted)">${l.photos.length} photo${l.photos.length > 1 ? 's' : ''} attached</div>` : ''}
    <div class="acts"><button class="btn primary" onclick="shareListing(${l.id})">Send to client</button>
    ${!readonly && state.me.team_size > 1 ? `<button class="btn ${l.shared ? 'on' : ''}" onclick="share(${l.id}, ${!l.shared})">${l.shared ? 'Shared with your team' : 'Share with your team'}</button>` : ''}</div></div>`;
}
function toggleRow(id) {
  const el = document.querySelector(`.lrow[data-id="${id}"]`); if (!el) return;
  const din = el.querySelector('.ldin');
  if (!din.dataset.ready) { const l = state.listings.find(x => x.id === id) || state.team_listings.find(x => x.id === id); din.innerHTML = detail(l, !!l.shared_by); din.dataset.ready = 1; }
  const open = el.classList.toggle('lopen'); open ? ui.open.add(id) : ui.open.delete(id);
  el.querySelector('.lhead').setAttribute('aria-expanded', open);
}
function renderList() {
  if (tab !== 'listings') return;
  const all = state.listings, mine = filteredListings(all), team = filteredListings(state.team_listings);
  const attn = all.filter(needsAttention).length;
  const counts = {type: {all: all.length, plot: 0, builder_floor: 0, apartment: 0}, view: {attention: attn}};
  all.forEach(l => counts.type[l.type]++);
  document.querySelectorAll('.pills').forEach(g => g.querySelectorAll('button').forEach(b => { b.classList.toggle('on', ui[g.dataset.k] === b.dataset.v); const i = b.querySelector('i'); const n = (counts[g.dataset.k] || {})[b.dataset.v]; if (i) i.textContent = n ?? ''; }));
  $('#lsum').textContent = `Showing ${mine.length} of ${all.length} properties` + (attn ? ` · ${attn} need a quick check` : '');
  let h = '';
  if (!mine.length) h += `<div class="empty">${all.length ? 'Nothing matches your search.<br><br><button class="btn" onclick="clearFilters()">Show everything</button>' : 'No properties yet.<br>Send or forward one in the chat to add it.'}</div>`;
  else if (ui.type === 'all') groupBy(mine, l => l.type).forEach((arr, t) => { h += `<div class="ghead">${TYPE_NAMES[t] || t}<span>${arr.length}</span></div>` + arr.map(l => listRow(l, false)).join(''); });
  else h += mine.map(l => listRow(l, false)).join('');
  if (team.length) h += `<div class="ghead">Shared by your team (view only)<span>${team.length}</span></div>` + team.map(l => listRow(l, true)).join('');
  setHTML($('#list'), h, [mine, team, ui.type]);
}
function clearFilters() { Object.assign(ui, {q: '', type: 'all', view: 'all'}); const q = $('#q'); if (q) q.value = ''; renderList(); }

// ----- requirements -----
const reqCache = {};
function reqRow(r) {
  const open = ui.reqOpen.has(r.id), isOpen = r.status === 'open';
  return `<div class="lrow ${open ? 'lopen' : ''} ${isOpen ? '' : 'dim'}" data-rid="${r.id}">
    <button class="lhead" onclick="toggleReq(${r.id})" aria-expanded="${open}"><span class="lid">#${r.id}</span>
      <span class="lmain"><span class="lt">${esc(r.client_name || 'Client')}</span><span class="ls">${esc(r.label)}</span></span>
      <span class="lright"><span class="tag ${isOpen && r.match_count ? 'ok' : ''}">${isOpen ? (r.match_count ? r.match_count + (r.match_count === 1 ? ' match' : ' matches') : 'No matches yet') : (STATUS[r.status] || r.status)}</span></span>${CHEV}</button>
    <div class="ldet"><div class="ldin" ${open ? 'data-ready="1"' : ''}>${open ? reqDetail(r) : ''}</div></div></div>`;
}
function reqDetail(r) {
  const kv = [['Status', r.status], ['Timeline', r.timeline], ['Motivation', r.motivation], ['Decision maker', r.decision_maker], ['Source', r.source]].filter(([, v]) => v);
  const ms = reqCache[r.id];
  const list = !ms ? '<div class="skel" style="height:44px"></div>' : ms.length ? ms.map(m => `<div class="mrow"><span><b>#${m.id}</b> ${esc(m.title)} · ${esc(m.market || '')}${m.shared_by ? ' · team: ' + esc(m.shared_by) : ''}</span><span class="price">${money(m.price, m.rent)}</span>
      <small>${m.fits.length ? 'Fits: ' + esc(m.fits.join(', ')) : ''}${m.lacks.length ? ' · Lacks: ' + esc(m.lacks.join('; ')) : ''}</small></div>`).join('') : '<div class="m" style="color:var(--muted)">No matching properties yet. You will get an alert when one arrives.</div>';
  return `<div class="dbody">${kv.length ? `<div class="kv">${kv.map(([k, v]) => `<div><small>${k}</small><span>${esc(v)}</span></div>`).join('')}</div>` : ''}
    <div class="sec" style="margin:0">Best matches</div><div id="rm${r.id}">${list}</div>
    ${ms && ms.length ? `<div class="acts"><button class="btn" onclick="shareMany([${ms.slice(0, 3).map(m => m.id).join(',')}])">${ICON_SHARE} Send best matches to client</button></div>` : ''}</div>`;
}
async function toggleReq(id) {
  const el = document.querySelector(`.lrow[data-rid="${id}"]`); if (!el) return;
  const r = state.requirements.find(x => x.id === id), din = el.querySelector('.ldin');
  const open = el.classList.toggle('lopen'); open ? ui.reqOpen.add(id) : ui.reqOpen.delete(id);
  el.querySelector('.lhead').setAttribute('aria-expanded', open);
  if (!open) return;
  din.innerHTML = reqDetail(r); din.dataset.ready = 1;
  if (r.status === 'open') {
    reqCache[id] = await (await fetch(`/api/requirement/matches?broker_id=${broker}&id=${id}`)).json();
    if (ui.reqOpen.has(id)) din.innerHTML = reqDetail(r);
  } else reqCache[id] = [];
}
function renderReqs() {
  if (tab !== 'reqs') return;
  const rs = [...state.requirements].sort((a, b) => (b.status === 'open') - (a.status === 'open') || b.match_count - a.match_count || b.id - a.id);
  const open = rs.filter(r => r.status === 'open'), closed = rs.filter(r => r.status !== 'open');
  setHTML($('#list'), !rs.length ? '<div class="empty">No client needs yet.<br>Tell the assistant what a client is looking for.</div>' :
    `<div class="sum" style="margin-bottom:4px">${open.filter(r => r.match_count).length} of ${open.length} clients have matching properties</div>` +
    (open.length ? `<div class="ghead">Looking now<span>${open.length}</span></div>` + open.map(reqRow).join('') : '') +
    (closed.length ? `<div class="ghead">Closed<span>${closed.length}</span></div>` + closed.map(reqRow).join('') : ''), rs);
}

// ----- notes (follow-ups first, then notes by day) -----
function renderNotes() {
  if (tab !== 'notes') return;
  const today = dayKey(new Date()), dueRank = t => t.done ? 3 : !t.due ? 2 : t.due < today ? 0 : 1;
  const fus = [...state.tasks].sort((a, b) => dueRank(a) - dueRank(b) || (a.due || '').localeCompare(b.due || ''));
  let h = `<div class="ghead">Things to follow up<span>${fus.filter(t => !t.done).length} pending</span></div>` +
    (fus.map(t => `<div class="fu ${t.done ? 'done' : ''}"><span class="tag ${t.done ? 'ok' : t.due && t.due < today ? 'bad' : t.due === today ? 'warn' : ''}">${t.done ? 'Done' : t.due ? (t.due < today ? 'Overdue' : t.due === today ? 'Today' : t.due.slice(5)) : 'Open'}</span><span>${esc(t.text)}${t.outcome ? `<small style="display:block;color:var(--muted)">Outcome: ${esc(t.outcome)}</small>` : ''}</span></div>`).join('') || '<div class="empty">Nothing to follow up</div>');
  h += `<div class="ghead">Notes and calls<span>You can ask about any of these in chat</span></div>`;
  if (!state.notes.length) h += '<div class="empty">No notes yet.<br>Tell the assistant about a visit or call and it will be saved here.</div>';
  else groupBy(state.notes, n => dayKey(n.ts)).forEach(arr => { h += `<div class="sec" style="margin:10px 0 2px">${dayLabel(arr[0].ts)}</div>` + arr.map(n => `<div class="tl"><time>${timeLabel(n.ts)}</time><div>${esc(n.text)}<small><span class="tag">${esc(n.kind[0].toUpperCase() + n.kind.slice(1))}</span>${n.listing_id ? 'Property #' + n.listing_id : ''}${n.listing_id && n.client_name ? ' · ' : ''}${n.client_name ? esc(n.client_name) : ''}</small></div></div>`).join(''); });
  setHTML($('#list'), h, [fus, state.notes]);
}

// ----- activity (grouped by day) -----
function renderHistory() {
  if (tab !== 'history') return;
  let h = '';
  if (!state.history.length) h = '<div class="empty">Nothing here yet</div>';
  else groupBy(state.history, x => dayKey(x.ts)).forEach(arr => { h += `<div class="ghead">${dayLabel(arr[0].ts)}<span>${arr.length}</span></div>` + arr.map(x => `<div class="tl"><time>${timeLabel(x.ts)}</time><div><b>${esc(({listing: 'Property', requirement: 'Client need', admin: 'Team', share: 'Share', general: 'Note'})[x.entity] || x.entity)}${x.entity_id ? ' #' + x.entity_id : ''}</b> · ${esc(x.event.replace(/_/g, ' '))}${x.detail ? `<small>${esc(x.detail.slice(0, 120))}</small>` : ''}</div></div>`).join(''); });
  setHTML($('#list'), h, state.history);
}

// ----- groups table (form is built once so typing is never lost) -----
function renderGroups() {
  if (tab !== 'groups') return;
  const gs = state.groups;
  setHTML($('#list'), gs.length ? `<table><tr><th>Group</th><th>Messages</th><th>Alerts</th><th>Skipped</th><th>Repeats</th><th></th></tr>` + gs.map((g, i) =>
    `<tr><td>${esc(g.name)}</td><td>${g.seen}</td><td>${g.surfaced}</td><td>${g.ignored}</td><td>${g.duplicates}</td><td><button class="btn ${g.muted ? '' : 'on'}" onclick="mute(${i}, ${!g.muted})">${g.muted ? 'muted' : 'watching'}</button></td></tr>`).join('') + '</table>' : '<div class="empty">No group messages yet</div>', gs);
}

function sendText(t) { $('#txt').value = t; return send(); }

async function send() {
  const text = $('#txt').value.trim();
  if (!text && !files.length) return;
  const media = files.map(f => f.type.startsWith('image/') ? {kind: 'image', url: URL.createObjectURL(f)} : {kind: f.type.startsWith('audio') || f.name.startsWith('voice') ? 'audio' : 'pdf', name: f.name});
  const me = bubble('me', text, media);                       // optimistic: appears instantly
  const fd = new FormData(); fd.append('broker_id', broker); fd.append('text', text); files.forEach(f => fd.append('files', f));
  $('#txt').value = ''; files = []; $('#files').textContent = ''; autosize(); chips([]);
  const t0 = performance.now(), t = bubble('bot', ''); t.innerHTML = '<span class="think"><i></i><i></i><i></i><span style="margin-left:6px">Thinking…</span></span>';
  document.body.classList.add('busy');
  const tick = setInterval(() => { const e = $('#tk'); if (e) e.textContent = ((performance.now() - t0) / 1000).toFixed(1) + 's'; }, 100);
  try {
    const res = await (await fetch('/api/chat', {method: 'POST', body: fd})).json();
    t.remove(); if (res.last_id) lastId = res.last_id;
    if (res.transcript) { const tr = me.querySelector('.tr'); if (tr) tr.textContent = '“' + res.transcript + '”'; }
    const total = Math.round(performance.now() - t0);
    (res.replies || []).forEach((r, i, a) => bubble('bot', r.text, r.images.map(u => ({kind: 'image', url: u})), i === a.length - 1 ? (res.fast ? res.ms : total) : null, res.fast));
    setLat(res.fast ? res.ms : total, res.fast);
    res.suggestions && res.suggestions.length ? chips(res.suggestions) : defaultChips();
  } catch (e) { t.remove(); bubble('bot', 'Error: ' + e); defaultChips(); }
  clearInterval(tick); document.body.classList.remove('busy');
  refresh();
}

function autosize() { const t = $('#txt'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; t.style.overflowY = t.scrollHeight > 120 ? 'auto' : 'hidden'; }
$('#txt').addEventListener('input', autosize);
$('#txt').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#txt').focus(); } if (e.key === 'Escape') $('#modal').hidden = true; });
$('#send').onclick = send;
$('#attach').onclick = () => $('#file').click();
$('#file').onchange = e => { files.push(...e.target.files); $('#files').textContent = 'Attached: ' + files.map(f => f.name).join(', '); e.target.value = ''; };

$('#mic').onclick = async () => {
  if (rec) { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    rec = new MediaRecorder(stream); chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const type = rec.mimeType || 'audio/webm', ext = type.includes('mp4') ? 'm4a' : 'webm';
      files.push(new File(chunks, 'voice-note.' + ext, {type: type.split(';')[0]}));
      rec = null; $('#mic').classList.remove('rec'); send();
    };
    rec.start(); $('#mic').classList.add('rec');
  } catch (e) { bubble('bot', 'Microphone not available: ' + e.message); }
};

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderSide(); });
$('#broker').onchange = e => { broker = e.target.value; localStorage.setItem('broker', broker); load(); };
$('#reset').onclick = async () => { if (confirm('Reset all demo data and chats?')) { await fetch('/api/reset', {method: 'POST'}); $('#menu').open = false; load(); } };
$('#samples').onchange = e => { const s = samples.find(x => x.id === e.target.value); if (s) { $('#txt').value = s.text; autosize(); $('#txt').focus(); $('#menu').open = false; } e.target.value = ''; };
const paintTheme = () => { const l = document.documentElement.dataset.theme === 'light'; $('#theme').textContent = l ? 'Dark mode' : 'Light mode'; document.querySelector('meta[name=theme-color]').content = l ? '#f4f4f5' : '#0a0a0b'; };
$('#theme').onclick = () => { const n = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = n; try { localStorage.setItem('theme', n); } catch (e) {} paintTheme(); };
paintTheme();
document.addEventListener('click', e => { const m = $('#menu'); if (m.open && !m.contains(e.target)) m.open = false; });

async function share(id, v) { await fetch(`/api/share?broker_id=${broker}&listing_id=${id}&shared=${v}`, {method: 'POST'}); refresh(); }
async function mute(i, m) { const g = state.groups[i].name; await fetch(`/api/group/mute?broker_id=${broker}&group=${encodeURIComponent(g)}&muted=${m}`, {method: 'POST'}); refresh(); }
async function ingest(group, sender, text) { return (await post('/api/group/ingest', {broker_id: broker, group, sender, text})).json(); }
async function postGroup() {
  const r = await ingest($('#gname').value, $('#gsender').value || 'Someone', $('#gtext').value);
  $('#gstat').textContent = r.outcome ? 'Result: ' + ({surfaced: 'alert sent', ignored: 'skipped', duplicate: 'already seen', muted: 'group muted'}[r.outcome] || r.outcome) : 'Error: ' + (r.detail || 'failed'); $('#gtext').value = ''; await poll(); refresh();
}
async function runFeed() {
  const feed = await (await fetch('/api/group-samples')).json(), tally = {}; let n = 0;
  for (const m of feed) { const r = await ingest(m.group, m.sender, m.text); tally[r.outcome] = (tally[r.outcome] || 0) + 1; $('#gstat').textContent = `${++n}/${feed.length}`; }
  $('#gstat').textContent = Object.entries(tally).map(([k, v]) => `${v} ${k}`).join(' · '); await poll(); refresh();
}
async function renderAdmin() {
  const p = $('#pane'), r = await fetch(`/api/admin/overview?broker_id=${broker}`);
  if (!r.ok) { p.innerHTML = '<div class="empty">Only the team owner can see this</div>'; return; }
  const o = await r.json();
  p.innerHTML = `<div class="sec">Your team · ${esc(o.brokerage.name)}</div><table><tr><th>Broker</th><th>Role</th><th>Properties</th><th>Shared</th><th>Client needs</th><th>Up to date</th></tr>` +
    o.members.map(m => `<tr><td>${esc(m.name)}<div class="m" style="color:var(--muted)">${esc(m.phone || '')}</div></td><td>${m.role}</td><td>${m.listings}</td><td>${m.shared}</td><td>${m.open_requirements}</td><td>${m.fresh_pct}%</td></tr>`).join('') +
    `</table><div class="m" style="color:var(--muted);font-size:12px">Each broker's properties are private unless shared. As the owner you can view and download everything (downloads are recorded).</div>
    <div class="sec">Download</div><div style="display:flex;gap:6px"><button class="btn" onclick="download('/api/admin/export?broker_id=${broker}&format=csv', 'properties.csv')">Download properties (CSV)</button> <button class="btn" onclick="download('/api/admin/export?broker_id=${broker}&format=json', 'everything.json')">Download everything</button></div>
    <div class="sec">Add a broker to your team</div><div class="card frm"><input id="nbname" placeholder="Name"><input id="nbphone" placeholder="WhatsApp number, e.g. +91 98xxxxxxxx">
    <div><button class="btn primary" onclick="addBroker()">Add to team</button> <span id="nbmsg" class="m"></span></div></div>`;
}
async function addBroker() {
  const r = await post(`/api/admin/brokers?broker_id=${broker}`, {name: $('#nbname').value, phone: $('#nbphone').value});
  const j = await r.json(); $('#nbmsg').textContent = r.ok ? 'Added ' + j.name + '. They can now message the assistant on WhatsApp.' : 'Error: ' + (j.detail || j.error);
  if (r.ok) { await loadBrokers(); renderAdmin(); }
}
async function loadBrokers() {
  const bs = await (await fetch('/api/brokers')).json();
  $('#broker').innerHTML = bs.map(b => `<option value="${b.id}">${esc(b.name.replace(' (demo)', ''))}${b.role === 'owner' ? ' (owner)' : ''} · ${esc(b.brokerage || 'solo')}</option>`).join('');
  $('#broker').value = broker; return bs;
}

let waStatus = {api_configured: false};
function waDigits(raw) { const d = (raw || '').replace(/\D/g, ''); return d.length === 10 ? '91' + d : d; }
function openShareModal(text, note) {
  $('#mtext').value = text; $('#mnote').textContent = note; $('#mstat').textContent = ''; $('#mstat').className = 'm';
  try { $('#mto').value = localStorage.getItem('lastTo') || ''; } catch (e) {}
  $('#msend').disabled = !waStatus.api_configured;
  $('#msend').title = waStatus.api_configured ? '' : 'Business WhatsApp number not connected yet. Use Open in WhatsApp.';
  $('#msend').textContent = waStatus.api_configured ? 'Send from business number' : 'Business number not connected';
  $('#modal').hidden = false;
}
async function shareReply(text) {
  const r = await (await post('/api/share-text/from-reply', {broker_id: broker, text})).json();
  openShareModal(r.text, r.client_safe ? 'Ready to send. The owner’s name and number, and your private notes, are not included.' : 'Please read before sending. This is the assistant’s reply and may include private details.');
}
async function shareMany(ids) {
  const r = await (await post('/api/share-text', {broker_id: broker, listing_ids: ids})).json();
  openShareModal(r.text, 'Ready to send. The owner’s name and number, and your private notes, are not included.');
}
const shareListing = id => shareMany([id]);
$('#mclose').onclick = () => { $('#modal').hidden = true; };
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').hidden = true; };
$('#mme').onclick = () => { $('#mto').value = (state.me && state.me.phone) || ''; };
$('#mwa').onclick = () => {
  const d = waDigits($('#mto').value);
  if (d.length < 11) { $('#mstat').className = 'm errmsg'; $('#mstat').textContent = 'Enter a valid WhatsApp number first.'; return; }
  try { localStorage.setItem('lastTo', $('#mto').value); } catch (e) {}
  window.open(`https://wa.me/${d}?text=${encodeURIComponent($('#mtext').value)}`, '_blank', 'noopener');
};
$('#msend').onclick = async () => {
  const st = $('#mstat'); st.className = 'm'; st.textContent = 'Sending…';
  const r = await post('/api/whatsapp/send', {broker_id: broker, to: $('#mto').value, text: $('#mtext').value}), j = await r.json();
  if (r.ok) { try { localStorage.setItem('lastTo', $('#mto').value); } catch (e) {} st.className = 'm okmsg'; st.textContent = 'Sent' + (j.mode === 'template' ? ' (as an approved template message)' : ''); }
  else { st.className = 'm errmsg'; st.textContent = 'Error: ' + (j.detail || 'could not send'); }
};
$('#lockgo').onclick = async () => {
  const k = $('#lockkey').value.trim(); if (!k) return;
  try { localStorage.setItem('accessKey', k); } catch (e) {}
  const r = await fetch('/api/brokers');
  if (r.status === 401) { $('#lockerr').textContent = 'That code is not right. Please try again.'; return; }
  location.reload();
};
$('#lockkey').addEventListener('keydown', e => { if (e.key === 'Enter') $('#lockgo').click(); });
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b)); document.body.classList.toggle('dataview', b.dataset.v === 'data');
});
document.querySelectorAll('[data-trig]').forEach(b => b.onclick = async () => { await fetch(`/api/dev/trigger?broker_id=${broker}&kind=${b.dataset.trig}`, {method: 'POST'}); poll(); });

async function poll() {
  if (document.hidden) return;
  try {
    const r = await (await fetch(`/api/poll?broker_id=${broker}&after=${lastId}`)).json();
    r.messages.forEach(m => { lastId = Math.max(lastId, m.id); if (m.role === 'bot') bubble('bot', m.text, m.media); });
    if (r.messages.length) refresh();
  } catch (e) {}
}
setInterval(poll, 4000);

(async () => {
  const [bs, h, ss] = await Promise.all([fetch('/api/brokers').then(r => r.json()), fetch('/api/health').then(r => r.json()), fetch('/api/samples').then(r => r.json())]);
  if (!bs.find(b => b.id === broker)) broker = bs[0].id; await loadBrokers();
  waStatus = await (await fetch('/api/whatsapp/status')).json();
  $('#conn').textContent = (h.llm_configured ? 'Assistant: connected' : 'Assistant: not connected') + '  ·  ' + (waStatus.api_configured ? 'WhatsApp: connected' : 'WhatsApp: share by link');
  $('#health').innerHTML = `<span><span class="dot ${h.llm_configured ? 'on' : ''}"></span>AI</span><span><span class="dot ${waStatus.api_configured ? 'on' : ''}"></span>WhatsApp</span>`;
  $('#health').title = (h.llm_configured ? 'AI connected' : 'AI not configured') + ' · ' + (waStatus.api_configured ? 'WhatsApp business number connected' : 'WhatsApp: links only (business number not connected)');
  samples = ss; ss.forEach(s => $('#samples').insertAdjacentHTML('beforeend', `<option value="${s.id}">${esc(s.label)}</option>`));
  load();
})();
</script>
